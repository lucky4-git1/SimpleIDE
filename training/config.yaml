# SimpleIDE Laya Fine-Tuning Configuration
model:
  base_model: "convaiinnovations/laya"
  base_revision: "4e7492c6b3e9a11db9cfcbf14be791197ad679ba"
  target_name: "simpleide-laya"
  task: "coding-agent-decision"
  max_context_length: 512
  max_option_length: 192

data:
  train_file: "training/data/train.jsonl"
  val_file: "training/data/val.jsonl"
  test_file: "training/data/test.jsonl"
  dataset_version: "simpleide-agent-v1"

training:
  seed: 42
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  epochs: 3
  fp16: true
  bf16: false
  early_stopping_patience: 2
  eval_steps: 100
  save_total_limit: 2

calibration:
  temperature_scaling: true
  brier_score_target: 0.085

export:
  format: "onnx"
  opset: 17
  output_dir: "models/laya/simpleide"
